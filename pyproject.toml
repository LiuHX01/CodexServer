[project]
name = "codex-server"
version = "0.1.0"
description = "HTTP gateway for the official Codex Python SDK"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21,<1",
    "fastapi>=0.115,<1",
    "openai-codex==0.162.1",
    "pydantic-settings>=2.6,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data", "app/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
