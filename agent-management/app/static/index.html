<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>AgentRelay · Agent 管理中枢</title>
    <link rel="icon" href="/assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/style.css?v=20261017-logs" />
    <script type="module" src="/assets/app.js?v=20261017-logs"></script>
  </head>
  <body>
    <div id="login" class="login-screen" hidden>
      <div class="login-card">
        <div class="brand-icon">↗</div>
        <p class="eyebrow">YOUR AGENTS, CONNECTED</p>
        <h1>登录 AgentRelay</h1>
        <p class="muted">连接执行端，掌握每一段会话。</p>
        <form id="login-form">
          <label for="access-key">访问密钥</label
          ><input
            id="access-key"
            type="password"
            placeholder="输入中枢访问密钥"
            required
            autocomplete="current-password"
          />
          <p class="field-hint">
            本地开发可在工程中运行
            <code>uv run python -m scripts.access</code> 查看密钥。
          </p>
          <button class="button primary" type="submit">
            进入管理中枢 <span>→</span>
          </button>
          <p id="login-error" class="error-text" role="alert"></p>
        </form>
        <div class="login-footer">
          AgentRelay <span>CONTROL PLANE / V0.1</span>
        </div>
      </div>
    </div>
    <div id="shell" class="shell" hidden>
      <aside class="sidebar">
        <a class="brand" href="#overview"
          ><span class="brand-icon">↗</span
          ><span>AgentRelay<small>CONTROL PLANE</small></span></a
        >
        <p class="nav-label">工作空间</p>
        <nav id="nav">
          <a href="#overview" data-nav="overview"
            ><span class="nav-icon">◫</span>总览</a
          >
          <a href="#agents" data-nav="agents"
            ><span class="nav-icon">◇</span>执行端<span
              id="agent-count"
              class="nav-count"
              >0</span
            ></a
          >
          <a href="#sessions" data-nav="sessions"
            ><span class="nav-icon">▤</span>会话</a
          >
          <a href="#requests" data-nav="requests"
            ><span class="nav-icon">◎</span>人工待办<span
              id="request-count"
              class="nav-count accent"
              >0</span
            ></a
          >
          <a href="#commands" data-nav="commands"
            ><span class="nav-icon">↳</span>操作记录</a
          >
          <a href="#logs" data-nav="logs"
            ><span class="nav-icon">≋</span>实时日志</a
          >
        </nav>
        <div class="sidebar-bottom">
          <a href="#guide" data-nav="guide"><span>?</span> 测试指南</a>
          <div class="profile">
            <div class="avatar">U</div>
            <div>
              <strong id="principal-name">—</strong
              ><small id="principal-role">—</small>
            </div>
            <button
              id="logout"
              class="icon-button"
              title="退出登录"
              aria-label="退出登录"
            >
              ⇥
            </button>
          </div>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <div class="breadcrumb">
            工作空间 <span>/</span> <strong id="page-name">总览</strong>
          </div>
          <div class="top-actions">
            <span id="stream-state" class="connection"><i></i>正在连接</span
            ><button id="refresh" class="button subtle small">↻ 刷新</button
            ><a href="/api-docs" target="_blank" class="api-link">API ↗</a>
          </div>
        </header>
        <main id="main" tabindex="-1">
          <div class="loading">正在加载管理中枢…</div>
        </main>
      </div>
    </div>
    <dialog id="modal"><div id="modal-content"></div></dialog>
    <div id="toast" class="toast" hidden role="status"></div>
  </body>
</html>
